<!doctype html>
<!-- Bridge for the iOS CMS editor: the landing page must sit in a same-origin iframe for its cms.js
     to enter preview mode, so this page hosts it and relays messages with the native app. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CMS preview</title>
    <style>
      html,
      body,
      iframe {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe src="/?cmsPreview=1" title="Landing page preview"></iframe>
    <script>
      (() => {
        const frame = document.querySelector('iframe');

        // Native → page. The app cannot message the iframe directly; the wrapper window is the
        // iframe's window.parent, which is the source cms.js accepts drafts and locales from.
        window.__cmsRelay = {
          draft: (doc) => {
            frame.contentWindow.postMessage({ type: 'meshx-cms-draft', doc }, location.origin);
          },
          locale: (code) => {
            frame.contentWindow.postMessage({ type: 'meshx-cms-locale', code }, location.origin);
          },
        };

        // Page → native. Only messages from our own iframe on our own origin are relayed.
        window.addEventListener('message', (event) => {
          if (event.origin !== location.origin || event.source !== frame.contentWindow) {
            return;
          }

          if (
            !['meshx-cms-ready', 'meshx-cms-edit', 'meshx-cms-move'].includes(event.data?.type)
          ) {
            return;
          }

          window.webkit?.messageHandlers?.cms?.postMessage(event.data);
        });
      })();
    </script>
  </body>
</html>
